[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bgs-generator"
version = "0.1.0"
description = "Geometry input, BGS/VGSS, GGFT, and FRW tools for capacitance extraction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7.0", "matplotlib>=3.7", "openpyxl>=3.1"]

[project.scripts]
frw = "FRW.cli:main"
bgs-generate = "bgs.main:main"
vgss-sample = "bgs.vgss_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
GGFT = ["data/*.npz"]
